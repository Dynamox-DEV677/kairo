<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Kairo</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background: #050505;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: #ffffff;
      -webkit-app-region: drag;       /* draggable splash on macOS */
      -webkit-user-select: none;
    }
    .stage {
      position: absolute; inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    .halo {
      position: absolute;
      width: 360px; height: 360px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      /* Ultramarine — deeper, more saturated than the electric primary.
         #2A4FE0 sits between the brand's #4F7CFF and #2046C2 anchors. */
      background: radial-gradient(circle,
        rgba(42, 79, 224, 0.55) 0%,
        rgba(31, 63, 207, 0.30) 30%,
        transparent 70%);
      filter: blur(44px);
      animation: pulse 2.4s ease-in-out infinite;
    }
    .logo {
      position: relative;
      width: 120px; height: 120px;
      border-radius: 28px;
      background: linear-gradient(135deg, #0B1530 0%, #050505 100%);
      box-shadow: 0 24px 56px rgba(42, 79, 224, .40),
                  inset 0 0 32px rgba(42, 79, 224, .10);
      display: flex; align-items: center; justify-content: center;
      animation: float 2.4s ease-in-out infinite;
    }
    .logo img {
      width: 78%; height: 78%;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,.5));
    }
    /* "Kairo" + AI pill on one row */
    .row {
      position: relative;
      display: flex; align-items: center; gap: 8px;
      margin-top: 8px;
    }
    .name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.02em;
      color: #ffffff;
    }
    /* White-on-glass AI pill — small, restrained, Apple-feel.
       Marks Kairo as an AI product at launch without shouting. */
    .ai {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.4px;
      color: #ffffff;
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .sub {
      position: relative;
      font-family: ui-monospace, 'SF Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      color: #ffffff;
      text-transform: uppercase;
      opacity: 0.92;
    }
    @keyframes pulse {
      0%,100% { opacity: 0.85; transform: translate(-50%,-50%) scale(1); }
      50%     { opacity: 1;    transform: translate(-50%,-50%) scale(1.08); }
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-6px); }
    }
  </style>
</head>
<body>
  <div class="halo"></div>
  <div class="stage">
    <div class="logo">
      <img src="assets/kyno-mark.png" alt="Kairo" />
    </div>
    <div class="row">
      <div class="name">Kairo</div>
      <div class="ai">AI</div>
    </div>
    <div class="sub">Accelerate your academics</div>
  </div>
</body>
</html>
