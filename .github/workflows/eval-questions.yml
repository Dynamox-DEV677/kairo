# Audit task 5 — nightly generated-question accuracy gate.
# Needs the GROQ_API_KEYS repository secret. The run FAILS when accuracy
# drops below the floor, which is the point.
name: eval-questions

on:
  schedule:
    - cron: '30 21 * * *'   # 03:00 IST nightly
  workflow_dispatch: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: kairo-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run accuracy harness (JEE/NEET Physics+Maths batch)
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          EVAL_FLOOR: '0.95'
        run: node --experimental-strip-types scripts/eval-questions.ts
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: kairo-dashboard/eval-reports/
          retention-days: 30
