         The 16/32 PNGs cover high-DPI displays.  192/512 are kept for PWA. -->

    <link rel="icon" type="image/png" sizes="16x16"   href="/kairo_icon_16.png?v=4" />
    <link rel="icon" type="image/png" sizes="32x32"   href="/kairo_icon_32.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/kairo_icon_192.png?v=4" />
    <link rel="icon" type="image/png" sizes="512x512" href="/kairo_icon_512.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA — manifest (required for install / Google Play TWA) + dark theme -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#050505" />
